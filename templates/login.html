<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema de Monitoreo</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f6f9;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-container{
    background:white;
    width:400px;
    padding:40px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    margin-bottom:10px;
    color:#2c3e50;
}

.subtitulo{
    text-align:center;
    margin-bottom:30px;
    color:#7f8c8d;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    background:#2c3e50;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#34495e;
}

.error{
    background:#ffe5e5;
    color:#c0392b;
    padding:10px;
    border-radius:8px;
    margin-bottom:15px;
    text-align:center;
}

.footer{
    margin-top:20px;
    text-align:center;
    color:#95a5a6;
    font-size:12px;
}

</style>

</head>

<body>

<div class="login-container">

    <h1>Sistema de Monitoreo</h1>

    <p class="subtitulo">
        Monitoreo SNMP de Passbolt y ChkMonitor
    </p>

    {% if mensaje %}
        <div class="error">
            {{ mensaje }}
        </div>
    {% endif %}

    <form method="POST">

        <label>Usuario</label>

        <input
            type="text"
            name="usuario"
            required
        >

        <label>Contraseña</label>

        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            Iniciar Sesión
        </button>

    </form>

    <div class="footer">
        Proyecto de Monitoreo de Infraestructura
    </div>

</div>

</body>
</html>
