services:
  db-slave:
    image: mariadb:10.5
    container_name: db_esclavo
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: monitoreo
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3307:3306"
    networks:
      - red-monitoreo

networks:
  red-monitoreo:
    driver: bridge
